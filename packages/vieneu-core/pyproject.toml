[project]
name = "vieneu-core"
version = "0.1.0"
description = "Framework-agnostic contracts, capabilities, errors, and fixtures for the VieNeu-TTS integration. Does not depend on FastAPI, SQLAlchemy, Next.js, Tauri, or VoidMelody app state."
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vieneu_core"]

[tool.setuptools.package-dir]
vieneu_core = "src/vieneu_core"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
